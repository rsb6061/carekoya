name: Sync Maryland Care Agencies

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/sync-maryland-rsa.trigger
  schedule:
    - cron: '23 10 * * 1'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fa11326492b5746f2276e22286c4d33d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm install xlsx --no-save

      - name: Apply agency schema
        run: npm run db:migrations:apply

      - name: Download official Maryland agency directories
        run: |
          BASE="https://health.maryland.gov/ohcq/docs/Provider-Listings/Excel"
          curl --fail-with-body --location --retry 4 --retry-delay 2 -A "Mozilla/5.0 CareJoys/1.0" \
            "$BASE/Health-Care-Staff-Agencies-EXCEL.xlsx" -o /tmp/maryland-hcsa.xlsx
          curl --fail-with-body --location --retry 4 --retry-delay 2 -A "Mozilla/5.0 CareJoys/1.0" \
            "$BASE/Home-Health-Agencies-EXCEL.xlsx" -o /tmp/maryland-hha.xlsx
          curl --fail-with-body --location --retry 4 --retry-delay 2 -A "Mozilla/5.0 CareJoys/1.0" \
            "$BASE/Residential-Service-Agencies-EXCEL.xlsx" -o /tmp/maryland-rsa.xlsx
          test -s /tmp/maryland-hcsa.xlsx
          test -s /tmp/maryland-hha.xlsx
          test -s /tmp/maryland-rsa.xlsx

      - name: Parse directories and build D1 upsert
        run: |
          node scripts/import-maryland-agencies.mjs \
            --hcsa /tmp/maryland-hcsa.xlsx \
            --hha /tmp/maryland-hha.xlsx \
            --rsa /tmp/maryland-rsa.xlsx \
            --output /tmp/maryland-agencies.sql

      - name: Import agencies into CareJoys
        run: npx wrangler d1 execute DB --remote --file=/tmp/maryland-agencies.sql

      - name: Build canonical agency organizations
        run: |
          node scripts/build-agency-organizations.mjs /tmp/agency-organizations.sql
          npx wrangler d1 execute DB --remote --file=/tmp/agency-organizations.sql

      - name: Score caregivers against agency organizations
        run: |
          npx wrangler d1 execute DB --remote --command="
          DELETE FROM agency_org_candidate_matches;
          WITH scored AS (
            SELECT
              ao.id AS organization_id,
              c.id AS caregiver_id,
              CASE
                WHEN lower(coalesce(ao.zip,''))=lower(coalesce(c.zip,'')) AND ao.zip!='' THEN 50
                WHEN lower(coalesce(ao.city,''))=lower(coalesce(c.city,'')) AND ao.city!='' THEN 35
                WHEN lower(coalesce(ao.state,''))=lower(coalesce(c.state,'')) AND ao.state!='' THEN 15
                ELSE 0
              END AS geography_score,
              CASE
                WHEN lower(coalesce(hp.roles,'')) LIKE '%' || lower(coalesce(c.role,'')) || '%' AND c.role!='' THEN 25
                WHEN lower(coalesce(hp.roles,'')) LIKE '%caregiver%' THEN 12
                ELSE 5
              END AS role_score,
              CASE
                WHEN c.last_confirmed_at IS NOT NULL AND datetime(c.last_confirmed_at) >= datetime('now','-30 days') THEN 15
                WHEN c.last_confirmed_at IS NOT NULL AND datetime(c.last_confirmed_at) >= datetime('now','-90 days') THEN 8
                ELSE 0
              END AS freshness_score,
              CASE
                WHEN ao.caregiver_relevance_score>=90 THEN 15
                WHEN ao.caregiver_relevance_score>=70 THEN 10
                ELSE 5
              END AS provider_score
            FROM agency_organizations ao
            LEFT JOIN agency_org_hiring_profiles hp ON hp.organization_id=ao.id
            CROSS JOIN caregivers c
            WHERE ao.is_active=1
              AND c.is_active=1
              AND (c.work_status='actively_looking' OR (c.source='legacy_carekoya' AND c.work_status='unknown'))
              AND (
                lower(coalesce(ao.state,''))=lower(coalesce(c.state,''))
                OR (upper(coalesce(c.state,''))='MD' AND ao.organization_key IS NOT NULL)
              )
          ), ranked AS (
            SELECT *,
              geography_score+role_score+freshness_score+provider_score AS fit_score,
              ROW_NUMBER() OVER (
                PARTITION BY caregiver_id
                ORDER BY geography_score+role_score+freshness_score+provider_score DESC, organization_id
              ) AS rn
            FROM scored
            WHERE geography_score>0
          )
          INSERT INTO agency_org_candidate_matches
            (id,organization_id,caregiver_id,fit_score,geography_score,role_score,freshness_score,provider_score,match_reason,status,last_scored_at)
          SELECT
            organization_id || ':' || caregiver_id,
            organization_id,caregiver_id,fit_score,geography_score,role_score,freshness_score,provider_score,
            json_object('geography',geography_score,'role',role_score,'freshness',freshness_score,'provider',provider_score),
            'matched',CURRENT_TIMESTAMP
          FROM ranked
          WHERE rn<=75;"
          
      - name: Verify Maryland agency universe
        run: |
          npx wrangler d1 execute DB --remote --command="SELECT provider_type,COUNT(*) AS active_records,SUM(caregiver_match_eligible) AS match_eligible FROM agencies WHERE source LIKE 'maryland_ohcq_%' AND is_active=1 GROUP BY provider_type ORDER BY provider_type;"
          npx wrangler d1 execute DB --remote --command="SELECT COUNT(DISTINCT organization_key) AS unique_organizations,COUNT(*) AS licensed_records,SUM(caregiver_match_eligible) AS match_eligible_records FROM agencies WHERE source LIKE 'maryland_ohcq_%' AND is_active=1;"
          npx wrangler d1 execute DB --remote --command="SELECT jurisdiction,COUNT(*) AS match_eligible FROM agencies WHERE source LIKE 'maryland_ohcq_%' AND is_active=1 AND caregiver_match_eligible=1 GROUP BY jurisdiction ORDER BY match_eligible DESC LIMIT 15;"
