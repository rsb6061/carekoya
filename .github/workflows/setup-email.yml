name: Setup Cloudflare Email

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/setup-cloudflare-email.trigger

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fa11326492b5746f2276e22286c4d33d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve carejoys.com zone
        id: zone
        run: |
          RESPONSE=$(curl --silent --show-error --fail-with-body \
            "https://api.cloudflare.com/client/v4/zones?name=carejoys.com&account.id=$CLOUDFLARE_ACCOUNT_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json")
          ZONE_ID=$(echo "$RESPONSE" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ]; then
            echo "Could not resolve carejoys.com zone."
            echo "$RESPONSE" | jq '{success,errors,messages}'
            exit 1
          fi
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"

      - name: Onboard carejoys.com to Email Sending
        run: |
          RESPONSE=$(curl --silent --show-error \
            -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.zone_id }}/email/sending/subdomains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"name":"carejoys.com"}')
          echo "$RESPONSE" | jq '{success,result:{name:.result.name,enabled:.result.enabled,dkim_selector:.result.dkim_selector,return_path_domain:.result.return_path_domain},errors}'
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success // false')
          if [ "$SUCCESS" != "true" ]; then
            exit 1
          fi

      - name: Verify Email Sending domain
        run: |
          curl --silent --show-error --fail-with-body \
            "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.zone_id }}/email/sending/subdomains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            | jq '{success,result:[.result[]|{name,enabled,dkim_selector,return_path_domain}]}'

      - name: Install dependencies
        run: npm install

      - name: Set private activation-send key
        run: |
          ACTIVATION_KEY=$(openssl rand -hex 32)
          printf '%s' "$ACTIVATION_KEY" | npx wrangler secret put ACTIVATION_SEND_KEY

      - name: Deploy email-enabled Worker
        run: npm run deploy

      - name: Verify CareJoys health
        run: curl --silent --show-error --fail https://carejoys.com/api/health
