name: Sync Maryland Training Programs

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/sync-maryland-training-programs.trigger
  schedule:
    - cron: '7 11 * * 1'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fa11326492b5746f2276e22286c4d33d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm install
      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Apply CareJoys migrations
        run: npm run db:migrations:apply

      - name: Download Maryland Board of Nursing directory
        run: |
          curl --fail-with-body --location --retry 4 --retry-delay 2 \
            -A "Mozilla/5.0 CareJoys/1.0" \
            "https://mbon.maryland.gov/Documents/approved-cna-training-programs-grid.pdf" \
            -o /tmp/maryland-training-programs.pdf
          test -s /tmp/maryland-training-programs.pdf

      - name: Parse approved nursing assistant programs
        run: |
          python scripts/import-maryland-training-programs.py \
            /tmp/maryland-training-programs.pdf \
            /tmp/maryland-training-programs.sql

      - name: Import training programs through D1 API
        env:
          D1_DATABASE_ID: bad7e436-d8af-4c90-b365-54411349c662
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path

          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          database=os.environ['D1_DATABASE_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{database}/query'
          sql=Path('/tmp/maryland-training-programs.sql').read_text()
          statements=[s.strip() for s in sql.split(';') if s.strip()]
          print(f'Executing {len(statements)} D1 statements')

          for i,statement in enumerate(statements,1):
              payload=json.dumps({'sql':statement}).encode()
              req=urllib.request.Request(url,data=payload,method='POST',headers={
                  'Authorization':f'Bearer {token}',
                  'Content-Type':'application/json'
              })
              try:
                  with urllib.request.urlopen(req,timeout=30) as res:
                      body=json.loads(res.read())
              except urllib.error.HTTPError as e:
                  detail=e.read().decode(errors='replace')
                  raise SystemExit(f'D1 HTTP failure at statement {i}: {detail[:2000]}')
              if not body.get('success'):
                  raise SystemExit(f'D1 query failure at statement {i}: {json.dumps(body.get("errors",[]))[:2000]}')
              if i % 50 == 0 or i == len(statements):
                  print(f'Executed {i}/{len(statements)}')
          PY

      - name: Deactivate stale program referral links
        run: |
          npx wrangler d1 execute DB --remote --command="
          UPDATE school_referral_codes
          SET status='inactive',updated_at=CURRENT_TIMESTAMP
          WHERE training_program_id IN (
            SELECT id FROM training_programs
            WHERE source='maryland_mbon_natp' AND is_active=0
          );"

      - name: Collapse duplicate program referral links
        run: |
          npx wrangler d1 execute DB --remote --command="
          WITH ranked AS (
            SELECT src.id,
              ROW_NUMBER() OVER (
                PARTITION BY lower(trim(tp.program_name)),coalesce(tp.zip,'')
                ORDER BY
                  CASE WHEN EXISTS (
                    SELECT 1 FROM training_program_outreach o
                    WHERE o.training_program_id=tp.id AND o.event_type='school_intro'
                  ) THEN 0 ELSE 1 END,
                  CASE
                    WHEN lower(tp.program_type) LIKE '%certified/geriatric%' THEN 0
                    WHEN lower(tp.program_type) LIKE '%certified nursing assistant training program%' THEN 1
                    WHEN lower(tp.program_type) LIKE '%cna-only%' THEN 2
                    ELSE 3
                  END,
                  src.created_at
              ) AS rn
            FROM school_referral_codes src
            JOIN training_programs tp ON tp.id=src.training_program_id
            WHERE src.status='active' AND tp.is_active=1 AND tp.source='maryland_mbon_natp'
          )
          UPDATE school_referral_codes
          SET status='inactive',updated_at=CURRENT_TIMESTAMP
          WHERE id IN (SELECT id FROM ranked WHERE rn>1);"

      - name: Normalize training program cities from Maryland ZIPs
        run: |
          npx wrangler d1 execute DB --remote --command="
          UPDATE training_programs
          SET city=(
            SELECT a.city
            FROM agencies a
            WHERE a.is_active=1
              AND a.zip=training_programs.zip
              AND a.city IS NOT NULL AND a.city!=''
            GROUP BY a.city
            ORDER BY COUNT(*) DESC,a.city
            LIMIT 1
          ),
          updated_at=CURRENT_TIMESTAMP
          WHERE source='maryland_mbon_natp'
            AND zip IS NOT NULL AND zip!=''
            AND EXISTS (
              SELECT 1 FROM agencies a
              WHERE a.is_active=1 AND a.zip=training_programs.zip
                AND a.city IS NOT NULL AND a.city!=''
            );"

      - name: Seed website and email from matching agency records
        run: |
          npx wrangler d1 execute DB --remote --command="
          UPDATE training_programs
          SET website=(
                SELECT ao.primary_website
                FROM agency_organizations ao
                WHERE ao.is_active=1
                  AND lower(trim(ao.canonical_name))=lower(trim(training_programs.program_name))
                  AND ao.primary_website IS NOT NULL
                LIMIT 1
              ),
              email=(
                SELECT ao.primary_email
                FROM agency_organizations ao
                WHERE ao.is_active=1
                  AND lower(trim(ao.canonical_name))=lower(trim(training_programs.program_name))
                  AND ao.primary_email IS NOT NULL
                LIMIT 1
              ),
              phone=(
                SELECT ao.primary_phone
                FROM agency_organizations ao
                WHERE ao.is_active=1
                  AND lower(trim(ao.canonical_name))=lower(trim(training_programs.program_name))
                  AND ao.primary_phone IS NOT NULL
                LIMIT 1
              ),
              updated_at=CURRENT_TIMESTAMP
          WHERE source='maryland_mbon_natp'
            AND EXISTS (
              SELECT 1 FROM agency_organizations ao
              WHERE ao.is_active=1
                AND lower(trim(ao.canonical_name))=lower(trim(training_programs.program_name))
            );"

      - name: Seed verified training program contacts
        run: npx wrangler d1 execute DB --remote --file=scripts/seed-training-program-contacts.sql

      - name: Verify program supply universe
        run: |
          npx wrangler d1 execute DB --remote --command="SELECT provider_type,COUNT(*) AS active_programs FROM training_programs WHERE source='maryland_mbon_natp' AND is_active=1 GROUP BY provider_type ORDER BY active_programs DESC;"
          npx wrangler d1 execute DB --remote --command="SELECT COUNT(*) AS active_programs,COUNT(DISTINCT city) AS cities,SUM(CASE WHEN website IS NOT NULL AND website!='' THEN 1 ELSE 0 END) AS with_website,SUM(CASE WHEN email IS NOT NULL AND email!='' THEN 1 ELSE 0 END) AS with_email FROM training_programs WHERE source='maryland_mbon_natp' AND is_active=1;"
          npx wrangler d1 execute DB --remote --command="SELECT COUNT(*) AS active_referral_links FROM school_referral_codes WHERE status='active';"
