name: CareJoys Network Audit

on:
  push:
    paths:
      - scripts/network-audit.trigger

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fa11326492b5746f2276e22286c4d33d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Caregiver geography and freshness
        run: |
          npx wrangler d1 execute DB --remote --command="
          SELECT state,COUNT(*) AS caregivers,
            SUM(CASE WHEN work_status='actively_looking' THEN 1 ELSE 0 END) AS actively_looking,
            SUM(CASE WHEN work_status='unknown' THEN 1 ELSE 0 END) AS unconfirmed,
            SUM(CASE WHEN work_status='not_looking' THEN 1 ELSE 0 END) AS not_looking
          FROM caregivers
          WHERE is_active=1
          GROUP BY state
          ORDER BY caregivers DESC;"

      - name: Maryland caregiver detail
        run: |
          npx wrangler d1 execute DB --remote --command="
          SELECT id,city,state,zip,role,work_status,last_confirmed_at,source
          FROM caregivers
          WHERE is_active=1 AND upper(state)='MD'
          ORDER BY city,zip;"

      - name: Agency routing funnel
        run: |
          npx wrangler d1 execute DB --remote --command="
          SELECT
            (SELECT COUNT(*) FROM agency_organizations WHERE is_active=1) AS organizations,
            (SELECT COUNT(*) FROM agency_organizations WHERE primary_domain IS NOT NULL AND primary_domain!='') AS with_domain,
            (SELECT COUNT(*) FROM agency_organizations WHERE last_enriched_at IS NOT NULL) AS enriched,
            (SELECT COUNT(*) FROM agency_org_candidate_matches) AS matches,
            (SELECT COUNT(*) FROM agency_teaser_tokens WHERE sent_at IS NOT NULL) AS teasers_sent,
            (SELECT COUNT(*) FROM agency_teaser_tokens WHERE opened_at IS NOT NULL) AS teaser_opened,
            (SELECT COUNT(*) FROM agency_teaser_tokens WHERE claim_requested_at IS NOT NULL) AS claims_requested,
            (SELECT COUNT(*) FROM agency_teaser_tokens WHERE claimed_at IS NOT NULL) AS claims_verified;"

      - name: Match distribution
        run: |
          npx wrangler d1 execute DB --remote --command="
          SELECT c.city,c.zip,c.role,c.work_status,COUNT(m.id) AS agency_matches,MAX(m.fit_score) AS top_fit,ROUND(AVG(m.fit_score),1) AS avg_fit
          FROM caregivers c
          LEFT JOIN agency_org_candidate_matches m ON m.caregiver_id=c.id
          WHERE c.is_active=1 AND upper(c.state)='MD'
          GROUP BY c.id
          ORDER BY top_fit DESC;"
