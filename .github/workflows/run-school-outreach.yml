name: Run First School Outreach

on:
  push:
    paths:
      - scripts/run-school-outreach.trigger

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fa11326492b5746f2276e22286c4d33d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Set one-time school outreach key
        run: |
          KEY=$(openssl rand -hex 32)
          echo "::add-mask::$KEY"
          echo "SCHOOL_OUTREACH_KEY=$KEY" >> "$GITHUB_ENV"
          printf '%s' "$KEY" | npx wrangler secret put SCHOOL_OUTREACH_KEY

      - name: Wait for secret deployment
        run: sleep 8

      - name: Send first three school partner emails
        run: |
          RESPONSE=$(curl --silent --show-error --fail-with-body \
            -X POST https://carejoys.com/api/internal/school-outreach \
            -H "content-type: application/json" \
            -H "x-carejoys-school-key: $SCHOOL_OUTREACH_KEY" \
            --data '{"limit":3}')
          echo "$RESPONSE" | jq
          test "$(echo "$RESPONSE" | jq -r '.failed // 0')" = "0"
          test "$(echo "$RESPONSE" | jq -r '.sent // 0')" = "3"

      - name: Verify outreach records
        run: |
          npx wrangler d1 execute DB --remote --command="SELECT event_type,COUNT(*) AS count FROM training_program_outreach GROUP BY event_type ORDER BY event_type;"

      - name: Delete one-time school outreach key
        if: always()
        run: npx wrangler secret delete SCHOOL_OUTREACH_KEY || true
