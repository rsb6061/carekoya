name: Setup CareJoys Turnstile

on:
  push:
    paths:
      - scripts/setup-turnstile.trigger

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fa11326492b5746f2276e22286c4d33d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Create or rotate CareJoys Turnstile widget
        run: |
          LIST=$(curl --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/challenges/widgets" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          SITEKEY=$(echo "$LIST" | jq -r '.result[]? | select(.name=="CareJoys Production") | .sitekey' | head -1)

          if [ -z "$SITEKEY" ]; then
            RESPONSE=$(curl --silent --show-error \
              -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/challenges/widgets" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"domains":["carejoys.com","www.carejoys.com"],"mode":"managed","name":"CareJoys Production"}')
            SUCCESS=$(echo "$RESPONSE" | jq -r '.success // false')
            if [ "$SUCCESS" != "true" ]; then
              echo "$RESPONSE" | jq '{success,errors,messages}'
              exit 1
            fi
            SITEKEY=$(echo "$RESPONSE" | jq -r '.result.sitekey')
            SECRET=$(echo "$RESPONSE" | jq -r '.result.secret')
          else
            RESPONSE=$(curl --silent --show-error \
              -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/challenges/widgets/$SITEKEY/rotate_secret" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"invalidate_immediately":true}')
            SUCCESS=$(echo "$RESPONSE" | jq -r '.success // false')
            if [ "$SUCCESS" != "true" ]; then
              echo "$RESPONSE" | jq '{success,errors,messages}'
              exit 1
            fi
            SECRET=$(echo "$RESPONSE" | jq -r '.result.secret')
          fi

          echo "::add-mask::$SITEKEY"
          echo "::add-mask::$SECRET"
          printf '%s' "$SITEKEY" | npx wrangler secret put TURNSTILE_SITE_KEY
          printf '%s' "$SECRET" | npx wrangler secret put TURNSTILE_SECRET_KEY

      - name: Deploy Turnstile-enabled Worker
        run: npm run deploy

      - name: Verify public config
        run: |
          RESPONSE=$(curl --silent --show-error --fail https://carejoys.com/api/config)
          echo "$RESPONSE" | jq '{ok,turnstileConfigured:(.turnstileSiteKey != null)}'
          test "$(echo "$RESPONSE" | jq -r '.turnstileSiteKey != null')" = "true"
