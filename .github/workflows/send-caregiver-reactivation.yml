name: Send Caregiver Reactivation

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/send-caregiver-reactivation.trigger

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fa11326492b5746f2276e22286c4d33d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Rotate private activation-send key
        run: |
          ACTIVATION_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$ACTIVATION_KEY"
          echo "ACTIVATION_KEY=$ACTIVATION_KEY" >> "$GITHUB_ENV"
          printf '%s' "$ACTIVATION_KEY" | npx wrangler secret put ACTIVATION_SEND_KEY

      - name: Wait for Worker secret deployment
        run: sleep 8

      - name: Send one caregiver activation first
        run: |
          RESPONSE=$(curl --silent --show-error --fail-with-body \
            -X POST https://carejoys.com/api/internal/activation-email \
            -H "Content-Type: application/json" \
            -H "x-carejoys-activation-key: $ACTIVATION_KEY" \
            --data '{"mode":"batch","limit":1}')
          echo "$RESPONSE" | jq '{ok,attempted,sent,failed,results:[.results[]|{status,messageId,error}]}'
          SENT=$(echo "$RESPONSE" | jq -r '.sent // 0')
          FAILED=$(echo "$RESPONSE" | jq -r '.failed // 0')
          if [ "$SENT" != "1" ] || [ "$FAILED" != "0" ]; then
            exit 1
          fi

      - name: Send remaining caregiver activations
        run: |
          RESPONSE=$(curl --silent --show-error --fail-with-body \
            -X POST https://carejoys.com/api/internal/activation-email \
            -H "Content-Type: application/json" \
            -H "x-carejoys-activation-key: $ACTIVATION_KEY" \
            --data '{"mode":"batch","limit":50}')
          echo "$RESPONSE" | jq '{ok,attempted,sent,failed,statuses:[.results[].status]}'
          FAILED=$(echo "$RESPONSE" | jq -r '.failed // 0')
          if [ "$FAILED" != "0" ]; then
            exit 1
          fi

      - name: Verify activation cohort
        run: |
          RESPONSE=$(curl --silent --show-error --fail https://carejoys.com/api/activation-stats)
          echo "$RESPONSE" | jq
          SENT=$(echo "$RESPONSE" | jq -r '.stats.sent // 0')
          if [ "$SENT" != "47" ]; then
            echo "Expected 47 activation emails marked sent; got $SENT"
            exit 1
          fi
