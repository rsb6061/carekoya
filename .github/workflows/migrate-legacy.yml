name: Migrate Legacy Caregivers

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/migrate-floot.trigger

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fa11326492b5746f2276e22286c4d33d
      FLOOT_EXPORT_TOKEN: ${{ secrets.FLOOT_EXPORT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Validate migration secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$FLOOT_EXPORT_TOKEN" || (echo "Missing FLOOT_EXPORT_TOKEN" && exit 1)

      - name: Export caregiver profiles from legacy Floot database
        run: |
          curl --silent --show-error --fail \
            -H "x-export-token: $FLOOT_EXPORT_TOKEN" \
            "https://c343098d-2e35-491e-b294-2ceb1ee12a83.sandbox.floot.app/_api/admin/carejoys-export" \
            -o /tmp/floot-caregivers.json

      - name: Prepare private D1 import
        run: node scripts/import-floot-to-d1.mjs /tmp/floot-caregivers.json /tmp/carejoys-import.sql

      - name: Import into CareJoys D1
        run: npx wrangler d1 execute DB --remote --file=/tmp/carejoys-import.sql

      - name: Verify imported cohort
        run: npx wrangler d1 execute DB --remote --command="SELECT source, work_status, COUNT(*) AS count FROM caregivers GROUP BY source, work_status;"

      - name: Remove temporary migration files
        if: always()
        run: rm -f /tmp/floot-caregivers.json /tmp/carejoys-import.sql
