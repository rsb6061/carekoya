name: Rebuild Caregiver Training Organizations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-training-organizations.mjs
      - migrations/0016_training_organizations.sql
      - .github/workflows/rebuild-training-organizations.yml

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fa11326492b5746f2276e22286c4d33d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Apply CareJoys migrations
        run: npm run db:migrations:apply

      - name: Rebuild canonical caregiver training organizations
        run: |
          node scripts/build-training-organizations.mjs /tmp/training-organizations.sql
          npx wrangler d1 execute DB --remote --file=/tmp/training-organizations.sql

      - name: Verify pilot organization URLs
        run: |
          npx wrangler d1 execute DB --remote --command="
          SELECT canonical_name,slug,location_count,active_program_count
          FROM training_organizations
          WHERE is_active=1
            AND (
              lower(canonical_name) LIKE 'it works learning center%' OR
              lower(canonical_name)='top knowledge healthcare institute' OR
              lower(canonical_name)='caroline center' OR
              lower(canonical_name)='cambridge nursing assistant academy' OR
              lower(canonical_name)='vision allied health institute' OR
              lower(canonical_name)='baltimore city community college' OR
              lower(canonical_name) LIKE 'care ''xpert academy%' OR
              lower(canonical_name)='heritage care' OR
              lower(canonical_name) LIKE 'dominion academy%' OR
              lower(canonical_name)='beacon institute'
            )
          ORDER BY canonical_name;"
