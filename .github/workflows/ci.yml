name: CI
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: carekoya-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:node
      - run: npm run build
      - name: Click-through test (every page, link and button, and the main flows)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Click-through test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: click-through-report
          path: |
            playwright-report
            test-results
          retention-days: 7
