name: DataForSEO Agency Import

# Pulls Google business listings for home care agencies through DataForSEO. The pull itself runs inside the
# Worker (src/dataforseo.ts), using DATAFORSEO_LOGIN / DATAFORSEO_PASSWORD from the Worker's Cloudflare settings;
# this workflow only queues the job, waits for the five-minute cron to finish it, and then regroups agencies.
# Run with mode=estimate first: it costs about a cent per state × category and writes no agencies.

on:
  workflow_dispatch:
    inputs:
      states:
        description: Two-letter state codes, comma separated
        default: VA
        required: true
      mode:
        description: estimate counts listings only; import saves them
        type: choice
        options: [estimate, import]
        default: estimate
      max_cost:
        description: Most to spend on DataForSEO in this run (USD)
        default: '10'

permissions:
  contents: read

concurrency:
  group: dataforseo-agency-import
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: fa11326492b5746f2276e22286c4d33d
      STATES: ${{ inputs.states }}
      MODE: ${{ inputs.mode }}
      MAX_COST: ${{ inputs.max_cost }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Queue the pull
        run: |
          STATES=$(echo "$STATES" | tr '[:lower:]' '[:upper:]' | tr -d ' ')
          [[ "$STATES" =~ ^[A-Z]{2}(,[A-Z]{2})*$ ]] || { echo "states must look like VA or VA,DC"; exit 1; }
          [[ "$MAX_COST" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "max_cost must be a number"; exit 1; }
          [[ "$MODE" == estimate || "$MODE" == import ]] || exit 1
          JOB_ID="dfs_$(date -u +%Y%m%d%H%M%S)_${GITHUB_RUN_ID}"
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          npx wrangler d1 execute DB --remote --command="INSERT INTO dataforseo_import_jobs(id,states,mode,max_cost) VALUES ('$JOB_ID','$STATES','$MODE',$MAX_COST);"

      - name: Wait for the Worker to finish
        run: |
          for i in $(seq 1 360); do
            ROW=$(npx wrangler d1 execute DB --remote --json --command="SELECT status,spent,listings,agencies,error FROM dataforseo_import_jobs WHERE id='$JOB_ID';" 2>/dev/null | jq -c '.[0].results[0]')
            echo "$(date -u +%H:%M:%S) $ROW"
            STATUS=$(echo "$ROW" | jq -r '.status')
            case "$STATUS" in
              estimated|done|stopped) break ;;
              failed) echo "::error::DataForSEO pull failed: $(echo "$ROW" | jq -r '.error')"; exit 1 ;;
            esac
            sleep 30
          done
          case "$STATUS" in estimated|done|stopped) ;; *) echo "::error::Timed out waiting for the Worker (status $STATUS)"; exit 1 ;; esac
          echo "STATUS=$STATUS" >> "$GITHUB_ENV"

      - name: Summarize
        run: |
          npx wrangler d1 execute DB --remote --json --command="SELECT status,spent,listings,agencies,error,plan_json FROM dataforseo_import_jobs WHERE id='$JOB_ID';" \
            | jq -r '.[0].results[0] | "Status: \(.status)\nSpent: $\(.spent)\nListings found: \(.listings)\nAgencies saved: \(.agencies)\n" + ((.plan_json // "[]") | fromjson | map("  \(.state) \(.category): \(.total) listings (region=\(.filterValue))") | join("\n"))' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build canonical agency organizations
        if: env.STATUS == 'done' || env.STATUS == 'stopped'
        run: |
          node scripts/build-agency-organizations.mjs /tmp/agency-organizations.sql
          npx wrangler d1 execute DB --remote --file=/tmp/agency-organizations.sql

      - name: Report coverage
        if: env.STATUS == 'done' || env.STATUS == 'stopped'
        run: |
          npx wrangler d1 execute DB --remote --command="SELECT state,COUNT(*) AS organizations,SUM(CASE WHEN sources LIKE '%,%' THEN 1 ELSE 0 END) AS multi_source,SUM(CASE WHEN coalesce(primary_website,'')!='' OR coalesce(primary_domain,'')!='' THEN 1 ELSE 0 END) AS crawlable,SUM(CASE WHEN coalesce(primary_email,'')!='' THEN 1 ELSE 0 END) AS emailable FROM agency_organizations WHERE is_active=1 AND state IN (SELECT DISTINCT state FROM agencies WHERE source='google_business') GROUP BY state ORDER BY organizations DESC;"
