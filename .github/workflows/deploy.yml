name: Deploy CareJoys

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "migrations/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carekoya-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run typecheck
      - run: npm run build

      - name: Deploy Worker and D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fa11326492b5746f2276e22286c4d33d
        run: |
          npm run db:migrations:apply
          npx wrangler deploy

      - name: Smoke test production domain and database
        run: |
          echo "Production health:"
          curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 2             https://carejoys.com/api/health
          echo
          echo "WWW health:"
          curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 2             https://www.carejoys.com/api/health
          echo
          echo "Auth boundary smoke tests:"
          test "$(curl --connect-timeout 3 --max-time 10 -s -o /tmp/candidates.json -w '%{http_code}' https://carejoys.com/api/candidates)" = "401"
          test "$(curl --connect-timeout 3 --max-time 10 -s -o /tmp/workspace.json -w '%{http_code}' https://carejoys.com/api/workspace)" = "401"
          test "$(curl --connect-timeout 3 --max-time 10 -s -o /tmp/pipeline.json -w '%{http_code}' https://carejoys.com/api/pipeline)" = "401"
          echo "CareJoys favicon:"
          curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/favicon.png >/dev/null
          HOME_HEAD=$(curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/)
          echo "$HOME_HEAD" | grep -q '/favicon.png?v=2'
          echo "Legal routes:"
          curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/privacy-policy >/dev/null
          curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/terms-of-service >/dev/null
          echo "Maryland supply routes:"
          curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/caregiver-jobs/maryland >/dev/null
          curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/schools/maryland >/dev/null
          echo "Caregiver training directory:"
          curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/training-programs/maryland >/dev/null
          echo "SEO discovery routes:"
          curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/sitemap.xml | grep -q '<urlset'
          curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/robots.txt | grep -q 'Sitemap: https://carejoys.com/sitemap.xml'
          curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/llms.txt | grep -q 'CareJoys is a Maryland caregiver recruiting and placement network'
          HOME_HTML=$(curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/)
          echo "$HOME_HTML" | grep -q '<link rel="canonical" href="https://carejoys.com/"'
          TRAINING_HTML=$(curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/training-programs/maryland)
          echo "$TRAINING_HTML" | grep -q '<link rel="canonical" href="https://carejoys.com/training-programs/maryland"'
          echo "$TRAINING_HTML" | grep -q '<title>Maryland CNA &amp; GNA Caregiver Training Programs | CareJoys</title>'
          echo "$TRAINING_HTML" | grep -q 'name="description"'
          OLD_EMPLOYER=$(curl --connect-timeout 3 --max-time 15 -s -o /dev/null -w '%{http_code} %{redirect_url}' https://carejoys.com/caregiver-recruiting/maryland)
          test "$OLD_EMPLOYER" = "301 https://carejoys.com/hire-caregivers/maryland"
          EMPLOYER_HTML=$(curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/hire-caregivers/maryland)
          echo "$EMPLOYER_HTML" | grep -q '<title>Hire Caregivers in Maryland | CareJoys</title>'
          echo "$EMPLOYER_HTML" | grep -q '<link rel="canonical" href="https://carejoys.com/hire-caregivers/maryland"'
          echo "$EMPLOYER_HTML" | grep -q '"@type":"Service"'
          echo "$EMPLOYER_HTML" | grep -q 'Find local CNAs, GNAs, HHAs, PCAs and caregivers who are actually interested in your opening.'
          ABOUT_HTML=$(curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/about)
          echo "$ABOUT_HTML" | grep -q '<title>About CareJoys | Maryland Caregiver Recruiting Network</title>'
          echo "$ABOUT_HTML" | grep -q '"@type":"AboutPage"'
          CAREGIVER_HTML=$(curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/caregiver-jobs/maryland)
          echo "$CAREGIVER_HTML" | grep -q '<title>Caregiver Jobs in Maryland: CNA, GNA, HHA &amp; PCA | CareJoys</title>'
          echo "$CAREGIVER_HTML" | grep -q '<h1>Caregiver jobs in Maryland</h1>'
          echo "Caregiver resume funnel:"
          RESUME_HTML=$(curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/caregiver-resume)
          echo "$RESUME_HTML" | grep -q '<title>Caregiver Resume: Builder, Example &amp; Job Matching | CareJoys</title>'
          echo "$RESUME_HTML" | grep -q '<link rel="canonical" href="https://carejoys.com/caregiver-resume"'
          echo "$RESUME_HTML" | grep -q '<h1>Add your resume, get matched to the best caregiver jobs near you.</h1>'
          echo "$RESUME_HTML" | grep -q 'Upload your resume or start from scratch below. CareJoys matches you with the best caregiver employers and agencies.'
          echo "$RESUME_HTML" | grep -q '"@type":"WebApplication"'
          RESOURCE_HTML=$(curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/resources/how-to-become-a-caregiver-in-maryland)
          echo "$RESOURCE_HTML" | grep -q '<title>How to Become a Caregiver in Maryland | CareJoys</title>'
          echo "$RESOURCE_HTML" | grep -q '<link rel="canonical" href="https://carejoys.com/resources/how-to-become-a-caregiver-in-maryland"'
          SITEMAP=$(curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/sitemap.xml)
          echo "$SITEMAP" | grep -q 'https://carejoys.com/about'
          echo "$SITEMAP" | grep -q 'https://carejoys.com/hire-caregivers/maryland'
          echo "$SITEMAP" | grep -q 'https://carejoys.com/caregiver-resume'
          echo "$SITEMAP" | grep -q 'https://carejoys.com/resources/how-to-become-a-caregiver-in-maryland'
          if echo "$SITEMAP" | grep -q 'https://carejoys.com/caregiver-recruiting/maryland'; then exit 1; fi
          ROBOTS=$(curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/robots.txt)
          echo "$ROBOTS" | grep -q 'User-agent: OAI-SearchBot'
          echo "$ROBOTS" | grep -q 'Sitemap: https://carejoys.com/sitemap.xml'
          APP_HTML=$(curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/app)
          echo "$APP_HTML" | grep -q 'name="robots" content="noindex,nofollow"'
          echo "Pilot caregiver training organization routes:"
          for SLUG in             it-works-learning-center             top-knowledge-healthcare-institute             caroline-center             cambridge-nursing-assistant-academy             vision-allied-health-institute             baltimore-city-community-college             care-xpert-academy             heritage-care             dominion-academy             beacon-institute
          do
            curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 2 --retry-delay 1 "https://carejoys.com/training-programs/$SLUG" >/dev/null
            ORG=$(curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 2 --retry-delay 1 "https://carejoys.com/api/public/training-organization/$SLUG")
            test "$(echo "$ORG" | jq -r '.ok')" = "true"
            test "$(echo "$ORG" | jq -r '.programs | length > 0')" = "true"
          done
          PROGRAMS=$(curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/api/public/training-programs)
          test "$(echo "$PROGRAMS" | jq -r '.total > 0')" = "true"
          echo "Public config:"
          curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/api/config
          echo
          echo "Agency demand summary:"
          curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/api/public/agency-demand-summary
          echo
          echo "workers.dev fallback (non-blocking):"
          curl --connect-timeout 3 --max-time 15 --fail-with-body --retry 2 --retry-delay 2 https://carekoya.platesurf-dev-2026.workers.dev/api/health || true
          echo
