name: Deploy CareJoys

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run typecheck
      - run: npm run build

      - name: Deploy Worker and D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fa11326492b5746f2276e22286c4d33d
        run: |
          npm run db:migrations:apply
          npx wrangler deploy

      - name: Smoke test production domain and database
        run: |
          echo "Production health:"
          curl --fail-with-body --retry 5 --retry-delay 2             https://carejoys.com/api/health
          echo
          echo "WWW health:"
          curl --fail-with-body --retry 5 --retry-delay 2             https://www.carejoys.com/api/health
          echo
          echo "Auth boundary smoke tests:"
          test "$(curl -s -o /tmp/candidates.json -w '%{http_code}' https://carejoys.com/api/candidates)" = "401"
          test "$(curl -s -o /tmp/workspace.json -w '%{http_code}' https://carejoys.com/api/workspace/not-a-real-workspace)" = "401"
          echo "Legal routes:"
          curl --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/privacy-policy >/dev/null
          curl --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/terms-of-service >/dev/null
          echo "Public config:"
          curl --fail-with-body --retry 3 --retry-delay 1 https://carejoys.com/api/config
          echo
          echo "workers.dev fallback (non-blocking):"
          curl --fail-with-body --retry 2 --retry-delay 2 https://carekoya.platesurf-dev-2026.workers.dev/api/health || true
          echo
