name: Deploy CareJoys

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run typecheck
      - run: npm run build

      - name: Deploy Worker and D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fa11326492b5746f2276e22286c4d33d
        run: |
          npm run db:migrations:apply
          npx wrangler deploy

      - name: Smoke test Worker and database
        run: |
          echo "Worker health:"
          curl --fail-with-body --retry 5 --retry-delay 2             https://carekoya.platesurf-dev-2026.workers.dev/api/health
          echo
          echo "Custom domain health (non-blocking):"
          curl --fail-with-body --retry 2 --retry-delay 2             https://carejoys.com/api/health || true
          echo
